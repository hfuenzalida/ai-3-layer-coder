name: Tests

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:             ["windows-latest", "ubuntu-latest"]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      # plyer is optional — install it so guardian notification tests run fully
      - name: Install optional dependencies
        run: pip install plyer
        continue-on-error: true

      - name: Run tests with coverage
        env:
          # Provide a dummy key so config import doesn't fail on missing env var
          OPENROUTER_API_KEY: "ci-test-key-not-real"
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -q

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  lint:
    name: "Static checks"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: pip install pyflakes

      - name: Check for undefined names (pyflakes)
        # Exclude .venv and test files to keep signal clean
        run: |
          python -m pyflakes $(find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./tests/*" \
            -not -name "test_*.py") || true

      - name: Verify __version__.py is importable
        run: python -c "from __version__ import __version__; print('version:', __version__)"

      - name: Verify requirements.txt is present
        run: test -f requirements.txt && echo "requirements.txt found"
