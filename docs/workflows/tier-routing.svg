<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="Three-tier routing workflow">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
      .tier1 { fill: #ecfdf5; stroke: #059669; }
      .tier2 { fill: #eff6ff; stroke: #2563eb; }
      .tier3 { fill: #faf5ff; stroke: #7c3aed; }
      .title { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .lbl { font: 13px system-ui, sans-serif; fill: #334155; }
      .sub { font: 11px system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="820" height="320" fill="#f8fafc"/>
  <text x="410" y="28" text-anchor="middle" class="title">Task routing and execution</text>
  <rect x="30" y="55" width="140" height="56" rx="8" class="box"/>
  <text x="100" y="80" text-anchor="middle" class="lbl">User / REPL</text>
  <text x="100" y="98" text-anchor="middle" class="sub">task · plan · batch</text>
  <line x1="170" y1="83" x2="215" y2="83" stroke="#334155" marker-end="url(#arr)"/>
  <rect x="215" y="55" width="150" height="56" rx="8" class="box"/>
  <text x="290" y="80" text-anchor="middle" class="lbl">CodexRouter</text>
  <text x="290" y="98" text-anchor="middle" class="sub">keywords · complexity</text>
  <line x1="365" y1="83" x2="400" y2="83" stroke="#334155" marker-end="url(#arr)"/>
  <rect x="400" y="48" width="380" height="68" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="590" y="72" text-anchor="middle" class="lbl">Tier selection (cheapest capable)</text>
  <rect x="418" y="82" width="100" height="28" rx="6" class="tier1"/>
  <text x="468" y="101" text-anchor="middle" class="sub">T1 Ollama</text>
  <rect x="530" y="82" width="110" height="28" rx="6" class="tier2"/>
  <text x="585" y="101" text-anchor="middle" class="sub">T2 OpenRouter</text>
  <rect x="652" y="82" width="110" height="28" rx="6" class="tier3"/>
  <text x="707" y="101" text-anchor="middle" class="sub">T3 Orchestrator</text>
  <line x1="290" y1="111" x2="290" y2="155" stroke="#334155" marker-end="url(#arr)"/>
  <rect x="215" y="155" width="150" height="50" rx="8" class="box"/>
  <text x="290" y="178" text-anchor="middle" class="lbl">Orchestrator</text>
  <text x="290" y="196" text-anchor="middle" class="sub">circuit breaker</text>
  <line x1="365" y1="180" x2="430" y2="180" stroke="#334155" marker-end="url(#arr)"/>
  <rect x="430" y="155" width="120" height="50" rx="8" class="box"/>
  <text x="490" y="185" text-anchor="middle" class="lbl">SQLite cache</text>
  <line x1="550" y1="180" x2="615" y2="180" stroke="#334155" marker-end="url(#arr)"/>
  <rect x="615" y="155" width="130" height="50" rx="8" class="box"/>
  <text x="680" y="178" text-anchor="middle" class="lbl">Usage CSV</text>
  <text x="680" y="196" text-anchor="middle" class="sub">budget guardian</text>
  <rect x="215" y="235" width="530" height="60" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="480" y="262" text-anchor="middle" class="lbl">Guards: WORKFLOW_MAX_COST_USD · soft/hard lock · escalate on failure</text>
  <text x="480" y="282" text-anchor="middle" class="sub">Dry-run and --no-cloud modes bypass cloud tiers for testing</text>
</svg>